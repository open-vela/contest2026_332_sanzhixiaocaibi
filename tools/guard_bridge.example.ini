; 电脉卫士 大模型断闸决策网关 —— 配置样例
;
; 复制成 guard_bridge.ini 再填。guard_bridge.ini 已在 .gitignore 里，
; 不要把带 key 的文件提交上去。
;
; 也可以完全不写文件，改用环境变量（优先级更高）：
;   set GUARD_API_BASE=https://dashscope.aliyuncs.com/compatible-mode/v1
;   set GUARD_API_KEY=sk-xxxxxxxx
;   set GUARD_MODEL=qwen-plus

[llm]
; 任何 OpenAI 兼容接口都行，注意末尾要到 /v1 这一层，不要带 /chat/completions
;   通义千问  https://dashscope.aliyuncs.com/compatible-mode/v1   模型 qwen-plus
;   DeepSeek  https://api.deepseek.com/v1                        模型 deepseek-chat
;   智谱      https://open.bigmodel.cn/api/paas/v4               模型 glm-4-plus
api_base = https://dashscope.aliyuncs.com/compatible-mode/v1
api_key  = 在这里填你自己的 key
model    = qwen-plus

; 校园网慢的话可以调大
timeout  = 20

[serial]
; openvela 板子的 USB-Serial/JTAG 口
port = COM3
